[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "CRYCHIC"
dynamic = ["version"]
description = "Context-aware inference of cell-cell communication"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anndata>=0.10",
  "numpy>=1.26",
  "pandas>=2.1",
  "patsy>=0.5.6",
  "scipy>=1.11",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23",
  "pytest>=8",
  "pytest-cov>=5",
]
resources = [
  "pyarrow>=17",
]
plotting = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
benchmark = [
  "psutil>=5.9",
  "pyarrow>=17",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "threadpoolctl>=3.5",
]
dev = [
  "build>=1.2",
  "hatch>=1.14",
  "jsonschema>=4.23",
  "mypy>=1.14",
  "pandas-stubs>=2.1",
  "pyarrow>=17",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
  "types-jsonschema>=4.23",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build]
exclude = ["**/AGENTS.md"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/docs/adr",
  "/pyproject.toml",
  "/schemas",
  "/src/crychic",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crychic"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/config.schema.json" = "crychic/schemas/config.schema.json"
"schemas/provenance.schema.json" = "crychic/schemas/provenance.schema.json"
"schemas/run_manifest.schema.json" = "crychic/schemas/run_manifest.schema.json"
"schemas/edge_evidence.schema.json" = "crychic/schemas/edge_evidence.schema.json"
"schemas/scoring_collections.schema.json" = "crychic/schemas/scoring_collections.schema.json"
"schemas/interactions.schema.json" = "crychic/schemas/interactions.schema.json"
"schemas/differential.schema.json" = "crychic/schemas/differential.schema.json"
"schemas/responses.schema.json" = "crychic/schemas/responses.schema.json"
"schemas/sample_scores.schema.json" = "crychic/schemas/sample_scores.schema.json"
"schemas/signatures.schema.json" = "crychic/schemas/signatures.schema.json"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["crychic"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["crychic"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
follow_imports = "skip"
files = ["src/crychic", "tests/unit/core", "tests/contract"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
